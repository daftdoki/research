name: Update README with cogapp

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  # Catches a research PR whose summarizer step was skipped. cog would fail on
  # main otherwise, after the merge, which is a worse place to find out.
  check-summaries:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Every research folder has a summary
        run: |
          missing=0
          for d in */; do
            case "$d" in _*) continue ;; esac
            [ -f "${d}README.md" ] || continue
            if [ ! -s "${d}_summary.md" ]; then
              echo "::error::${d}_summary.md is missing or empty"
              missing=1
            fi
          done
          exit $missing

  update-readme:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for git log dates

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run cogapp to update README
        run: |
          cog -r -P README.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git add */README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update README with cogapp [skip ci]"
            git push
          fi
