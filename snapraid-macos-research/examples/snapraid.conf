# Example SnapRAID configuration tuned for macOS Apple Silicon
# Save as /opt/homebrew/etc/snapraid.conf (or any path you pass with `snapraid -c ...`).
#
# Assumptions:
#   - Each data and parity disk is an APFS volume mounted under /Volumes
#   - One parity disk; uncomment the 2-parity line to add a second
#   - At least one volume is large enough to hold parity >= the largest data disk
#
# Run a memtest before first sync. RAM errors are the #1 source of corruption.

# ---------- Parity ----------
# Parity disk(s) must be >= size of the largest data disk.
parity /Volumes/Parity1/snapraid.parity
# 2-parity /Volumes/Parity2/snapraid.2-parity
# 3-parity /Volumes/Parity3/snapraid.3-parity

# ---------- Content files ----------
# Hash database + file list. Need at least N+1 copies for N parity disks,
# each on a DIFFERENT physical disk. Easy rule: put one copy on each
# data disk plus one on the system disk.
content /Users/Shared/snapraid/snapraid.content
content /Volumes/Data1/snapraid.content
content /Volumes/Data2/snapraid.content
content /Volumes/Data3/snapraid.content

# ---------- Data disks ----------
# Each entry: a short symbolic name then the mount path.
# Names must remain stable across reconfiguration — if you rename, SnapRAID
# may consider the entire disk replaced.
data d1 /Volumes/Data1
data d2 /Volumes/Data2
data d3 /Volumes/Data3
# data d4 /Volumes/Data4

# ---------- Pool: unified read-only symlink view ----------
# After `snapraid sync`, run `snapraid pool` to create/refresh this directory.
# Apps that just need to read a unified library (Plex, Jellyfin, Emby, Finder)
# can point at /Volumes/Media and follow symlinks back to the data disks.
pool /Volumes/Media

# ---------- Exclusions ----------
# macOS metadata, junk files, and per-volume system trees.
# `**` (v14+) recursively matches across directories.
exclude *.unrecoverable
exclude /tmp/
exclude /lost+found/
exclude .DS_Store
exclude .AppleDouble
exclude ._*
exclude .fseventsd
exclude .Spotlight-V100
exclude .Trashes
exclude .TemporaryItems
exclude .DocumentRevisions-V100
exclude .AppleDB
exclude .Thumbs.db
exclude .VolumeIcon.icns
exclude .com.apple.timemachine.donotpresent
exclude .apdisk
# Plex / Jellyfin / Emby caches you don't want in parity
exclude /**/.@__thumb/
exclude /**/Thumbs.db
exclude /**/@eaDir/
# Hidden Time Machine local snapshots root
exclude /.timemachine/

# ---------- Optional behaviour ----------
# Block size (KiB). Default 256 is fine for typical media libraries.
# blocksize 256

# Hash algorithm (default: spooky2 / spookyhash 128-bit, 64-bit platforms).
# Leave alone unless you know what you're doing.
# hash spooky2

# Auto-save parity progress every X GiB (good for very long syncs).
autosave 250

# SnapRAID v13+: spin a disk down if its temperature exceeds this many °C.
# Useful for cramped JBOD enclosures.
# temp_limit 50

# SnapRAID v13+: add disks NOT in the array but you still want monitored.
# extra /dev/disk6

# SnapRAID v13+: ignore individual SMART attributes when computing failure prob.
# smartignore 193  # Load Cycle Count (already ignored by default in 13+)

# ---------- Workflow hints ----------
# snapraid diff           # show changed/added/removed files
# snapraid sync           # update parity to match current data
# snapraid status         # array stats, fragmentation, scrub age
# snapraid smart          # disk health (requires smartmontools on macOS)
# snapraid probe          # show spin state of each disk
# snapraid down           # spin down all data disks (smartctl-based; USB-limited)
# snapraid scrub -p 5 -o 10  # verify 5% of blocks older than 10 days
# snapraid fix            # restore failed/corrupt files using parity
